# EnergyKit graphical boot bootstrap
set gfxmode=auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

# Visual fallback even if the full GRUB theme parser rejects theme.txt.
if [ -f /boot/grub/live-theme/background.png ]; then
    background_image /boot/grub/live-theme/background.png
fi

set color_normal=light-gray/black
set color_highlight=white/blue

if [ -f /boot/grub/live-theme/theme.txt ]; then
    set theme=/boot/grub/live-theme/theme.txt
    export theme
fi

set default=0
set timeout_style=menu
set timeout=8

menuentry "EnergyKit installieren" --hotkey=e {
    linux KERNEL_LIVE APPEND_LIVE
    initrd INITRD_LIVE
}

menuentry "Wiederherstellungsmodus" {
    linux KERNEL_LIVE LB_BOOTAPPEND_LIVE_FAILSAFE
    initrd INITRD_LIVE
}

menuentry "Systeminformationen" {
    clear
    echo "EnergyKit Appliance v0.5.9"
    echo "H-IT Solutions"
    echo ""
    echo "Architektur: amd64"
    echo "Home Assistant OS Zielversion: 18.2"
    echo ""
    echo "ESC zum Zurueckkehren."
    sleep --interruptible 15
}

menuentry "Ausschalten" {
    halt
}
