# EnergyKit UEFI GRUB bootstrap.
# Important: this file must hand off to live-build's generated config.cfg.

search --no-floppy --set=root --file /live/vmlinuz
set prefix=($root)/boot/grub

if loadfont $prefix/dejavu-bold-16.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

if [ -f $prefix/live-theme/theme.txt ]; then
    set theme=$prefix/live-theme/theme.txt
    export theme
fi

if [ -f $prefix/config.cfg ]; then
    source $prefix/config.cfg
else
    echo "EnergyKit boot configuration not found: $prefix/config.cfg"
    echo "Press any key to enter the GRUB command line."
    read
fi
