name: EnergyKit
version: "0.5.5"
slug: energykit
description: Geführte Inbetriebnahme, Diagnose und Komponentenverwaltung für Energiesysteme.
url: __REPOSITORY_URL__
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: EnergyKit
panel_admin: true
hassio_api: true
hassio_role: admin
homeassistant_api: true
image: __IMAGE_BASE__
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: app_config
    read_only: false
    path: /config
  - type: all_app_configs
    read_only: false
    path: /addon_configs
options:
  simulation: true
schema:
  simulation: bool
backup: hot
