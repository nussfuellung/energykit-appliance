name: Build EnergyKit Appliance
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(awk -F'\"' '/^version:/{print $2; exit}' energykit/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./energykit
          file: ./energykit/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/energykit-amd64:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/energykit-amd64:latest

  iso:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render release-specific app metadata
        env:
          ENERGYKIT_GHCR_OWNER: ${{ github.repository_owner }}
          ENERGYKIT_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: bash ./scripts/render-release.sh
      - name: Install live-build
        run: sudo apt-get update && sudo apt-get install -y live-build xorriso isolinux syslinux-common
      - name: Build ISO
        run: sudo bash ./installer/build.sh

      - name: Verify ISO artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s energykit-installer-amd64.iso
          test -s energykit-installer-amd64.iso.sha256
          sha256sum -c energykit-installer-amd64.iso.sha256
          file energykit-installer-amd64.iso
          du -h energykit-installer-amd64.iso
          grep -a -q "EnergyKit Appliance Installer" energykit-installer-amd64.iso || true

      - uses: actions/upload-artifact@v4
        with:
          name: energykit-installer-amd64
          path: |
            energykit-installer-amd64.iso
            energykit-installer-amd64.iso.sha256
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            energykit-installer-amd64.iso
            energykit-installer-amd64.iso.sha256
